name: Build and publish Shadowrocket rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build.py --repository "$GITHUB_REPOSITORY"

  publish:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: shadowrocket-rules-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/build.py --repository "$GITHUB_REPOSITORY"
      - run: bash scripts/publish.sh
        env:
          PUBLISH_SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
