# shadowrocket-surf-rules
# 在「全局路由」选择「配置」。配置和服务器订阅分别管理。
[General]
ipv6 = true
prefer-ipv6 = false
dns-server = https://dns.alidns.com/dns-query
fallback-dns-server = https://doh.pub/dns-query,https://cloudflare-dns.com/dns-query
dns-direct-system = false
dns-fallback-system = false
dns-direct-fallback-proxy = false
hijack-dns = :53
udp-policy-not-supported-behaviour = REJECT

[Proxy Group]
ChatGPT = select,REJECT
常规代理 = select,REJECT

[Rule]
# ChatGPT 网页、App、认证、附件、WebSocket
DOMAIN-SUFFIX,chatgpt.com,ChatGPT
DOMAIN-SUFFIX,openai.com,ChatGPT
DOMAIN-SUFFIX,oaistatic.com,ChatGPT
DOMAIN-SUFFIX,oaiusercontent.com,ChatGPT
DOMAIN-SUFFIX,oaistatsig.com,ChatGPT
DOMAIN,cdn.openaimerge.com,ChatGPT
DOMAIN,challenges.cloudflare.com,ChatGPT
DOMAIN,cdn.workos.com,ChatGPT
DOMAIN,forwarder.workos.com,ChatGPT
DOMAIN,frontend-apps-multi-region.workos.com,ChatGPT
DOMAIN,images.workoscdn.com,ChatGPT
DOMAIN,setup.workos.com,ChatGPT
DOMAIN,workos.imgix.net,ChatGPT

# DoH 连接、局域网和 iOS 强制门户探测
DOMAIN,dns.alidns.com,DIRECT
DOMAIN,doh.pub,DIRECT
DOMAIN,cloudflare-dns.com,DIRECT
DOMAIN,captive.apple.com,DIRECT
DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve

